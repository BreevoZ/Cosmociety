[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmociety"
version = "0.1.0"
description = "Interpretable 1D experiments in stellar heat transport and emergent convection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=9.5"]
keywords = ["computational-physics", "stellar-transport", "convection", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "build>=1.2"]

[project.scripts]
cosmociety = "cosmociety.cli:main"

[project.urls]
Repository = "https://github.com/BreevoZ/Cosmociety"

[tool.setuptools.packages.find]
include = ["cosmociety*", "experiments*"]
namespaces = false
